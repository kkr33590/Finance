# XcodeGen reads this file and builds the Xcode project from it.
name: Finance
options:
  bundleIdPrefix: com.kkr
  deploymentTarget:
    iOS: "16"
targets:
  Finance:
    type: application
    platform: iOS
    # Every file inside this folder is part of the app.
    sources: [Finance]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kkr.finance
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "kKr"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"