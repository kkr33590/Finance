name: Build Unsigned IPA

# Runs when you start it (the Run button in kKr, or the Actions tab on GitHub).
on:
  workflow_dispatch:


jobs:
  build:
    # A Mac in the cloud builds the app, so you do not need your own Mac.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate app icon
        continue-on-error: true
        run: |
          mkdir -p Finance/Assets.xcassets/AppIcon.appiconset
          swift scripts/make_icon.swift Finance/Assets.xcassets/AppIcon.appiconset/icon-1024.png "F"
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no signing)
        # After a failed build, the errors are printed under "ERRORS" so you can read them in kKr.
        run: |
          set +e
          xcodebuild \
            -project Finance.xcodeproj \
            -scheme Finance \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" > build.log 2>&1
          STATUS=$?
          echo "===== ERRORS ====="
          grep -E "error:" build.log | sort -u | head -30
          echo "===== EXIT CODE: $STATUS ====="
          exit $STATUS

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Finance.app Payload/
          zip -r Finance.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Finance-unsigned-ipa
          path: Finance.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log